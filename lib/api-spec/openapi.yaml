      description: >
        The operator's identity comes entirely from JOBBLAST_LEGAL_* env
        vars (docs/SAAS-ARCHITECTURE.md section 8) - never hardcoded, since
        each self-hosted operator running their own beta fills in their own.
      properties:
        available:
          description: False when the operator has not configured JOBBLAST_LEGAL_OPERATOR yet.
          type: boolean
        operator:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        contact:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        postingsRetentionDays:
          description: How long an unreferenced shared posting is kept before the daily prune job removes it.
          type: number
        quotas:
          type: object
          properties:
            tailorPerDay:
