openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JobBlast application assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard aggregates
  - name: stats
    description: Campaign performance aggregates (funnel, response rate by source and by resume, weekly trend, average response delay)
  - name: jobs
    description: Ranked job listings
  - name: explore
    description: Direct free-text search across the entire shared pool of postings (lot J2), beyond what an account's own criteria have already surfaced
  - name: applications
    description: Application tracking
  - name: profile
    description: Job seeker profile
  - name: resumes
    description: Multiple master resumes per account, selected automatically per posting
  - name: documents
    description: CV / cover letter document management
  - name: settings
    description: AI provider setup wizard and automation toggles
  - name: auth
    description: Mode discovery and, in SaaS mode, accounts and sessions
  - name: onboarding
    description: New-account guided setup (SaaS mode only)
  - name: legal
    description: Operator identity and data policy (SaaS mode only)
  - name: account
    description: GDPR account rights - data export and deletion (SaaS mode only)
  - name: trial
    description: Anonymous CV-to-postings trial funnel, no account needed (SaaS mode only)
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Which mode this server runs in, and who is signed in
      description: >
        Public. In selfhosted mode the implicit local user is always
        returned, so the frontend never shows a login screen.
      responses:
        "200":
          description: Current mode and session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account from an invite code (SaaS mode only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid invite code, email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Registration does not exist in selfhosted mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password (SaaS mode only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Sign in does not exist in selfhosted mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Signed out
  /auth/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link (SaaS mode only)
      description: >
        Always responds 204, whether or not the address belongs to an
        account, so this endpoint never confirms which addresses are
        registered. When the email transport is not configured (or the
        address is unknown), nothing is sent and the response is identical.
        Rate limited by IP and by email (docs/SAAS-ARCHITECTURE.md section 2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: Always returned on a well-formed request, regardless of outcome
        "429":
          description: Too many attempts for this IP or this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not available on a self-hosted install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password from a reset token (SaaS mode only)
      description: >
        The token is single-use, 30-minute TTL, hashed at rest. On success every
        session on the account is invalidated, so a reset also signs out
        anyone else holding a live session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed, every session on the account invalidated
        "400":
          description: The token is invalid, expired or already used, or the new password does not meet the minimum requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not available on a self-hosted install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [onboarding]
      summary: Whether the signed-in account has finished onboarding, and which step to resume on
      description: >
        SaaS mode only. `nextStep` is derived from the account's actual
        stored profile and settings (which step still has no data), not from
        a separately tracked wizard position, so leaving mid-wizard and
        coming back resumes at the right place.
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "404":
          description: Onboarding does not exist on a self-hosted install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Marks onboarding done and enqueues the account's first refresh cycle
      description: >
        SaaS mode only. Enqueues the shared-refresh and scoring jobs this
        account is waiting on via the existing queue (the same path
        `POST /jobs/refresh` uses) - never a fetch inline in this request.
      responses:
        "200":
          description: Onboarding marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingCompleteResult"
        "404":
          description: Onboarding does not exist on a self-hosted install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /legal:
    get:
      operationId: getLegalInfo
      tags: [legal]
      summary: Operator identity and data policy (SaaS mode only)
      description: >
        Public - reachable from the login screen, before anyone has signed
        in. The operator's identity comes entirely from environment
        variables (JOBBLAST_LEGAL_*); `available` is false when the operator
        has not set them yet.
      responses:
        "200":
          description: Legal / privacy information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalInfo"
        "404":
          description: Not available on a self-hosted install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /trial/match:
    post:
      operationId: matchTrialCv
      tags: [trial]
      summary: Anonymous CV-to-postings trial match from pasted text (SaaS mode only)
      description: >
        Public - no session needed, and the whole point of this endpoint is
        that none is required yet. Deterministic keyword matching only
        (lib/anonymous-match.ts); never an AI call. The CV text is processed
        entirely in memory for this one request - never written to the
        database, to disk, or to a log line. Rate limited by IP (5 per day,
        shared with POST /trial/match/pdf). Returns the 2 best-matching
        postings from the shared pool, without their application URL (that
        stays a reason to create an account), plus how many postings above
        the relevance threshold exist in the scanned slice of the pool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialCvTextRequest"
      responses:
        "200":
          description: Best matches from the shared pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousMatchResult"
        "400":
          description: Missing, empty or oversized CV text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not available on a self-hosted install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many trial attempts from this IP today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /trial/match/pdf:
    post:
      operationId: matchTrialCvFromPdf
      tags: [trial]
      summary: Anonymous CV-to-postings trial match from an uploaded PDF (SaaS mode only)
      description: >
        Same as POST /trial/match, but the CV is a PDF (up to 5MB), extracted
        to text in memory under a bounded timeout and never saved anywhere -
        see lib/pdf-text.ts's extractPdfTextFromBufferWithTimeout. Shares the
        same per-IP daily rate-limit budget as the text endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MatchTrialCvFromPdfPayload"
      responses:
        "200":
          description: Best matches from the shared pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousMatchResult"
        "400":
          description: Missing/invalid PDF, or extraction failed or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not available on a self-hosted install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many trial attempts from this IP today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/export:
    get:
      operationId: getAccountExport
      tags: [account]
      summary: Full data export for the signed-in account (SaaS mode only)
      description: >
        GDPR portability: profile, settings (no AI keys), applications,
        postings, interview briefs and document metadata. Document bytes are
        excluded - each entry links to the existing per-document endpoint
        instead, so nothing here duplicates the file store.
      responses:
        "200":
          description: The account's data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "404":
          description: Not available on a self-hosted install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the signed-in account (SaaS mode only)
      description: >
        GDPR erasure. Confirmed by re-entering the password. Deletes the
        `users` row (cascading every table that references it), the
        account's files on disk, and signs the caller out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Deleted
        "400":
          description: Missing password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not available on a self-hosted install, or the account no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /stats:
    get:
      operationId: getCampaignStats
      tags: [stats]
      summary: Get campaign performance stats
      description: >
        Every number is derived from existing applications, their timeline
        events and the postings they came from - lot I4 adds no new table.
        `byResume` is null unless the account has sent applications under at
        least two distinct resume labels; `bySource` only lists sources with
        at least one sent application; `averageResponseDelayDays` is null
        until at least one application has a recorded first response.
      responses:
        "200":
          description: Campaign performance stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignStats"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List ranked job matches
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/JobStatus"
      responses:
        "200":
          description: Ranked job matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobListing"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job listing with tailored documents
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Job listing details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListing"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/skip:
    post:
      operationId: skipJob
      tags: [jobs]
      summary: Skip a job in the review queue
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Job skipped
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/cover-letter.pdf:
    get:
      operationId: getJobCoverLetterPdf
      tags: [jobs]
      summary: Generate a PDF of the job's tailored cover letter
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cover letter PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/tailor:
    get:
      operationId: getJobTailoringStatus
      tags: [jobs]
      summary: Where this posting's cover letter has got to
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Current state of the letter for this posting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTailoringStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: requestJobTailoring
      tags: [jobs]
      summary: Ask for this posting's cover letter to be written
      description: >
        In SaaS mode letters are written strictly on demand, because they
        spend the account's own metered AI budget: this queues one and the
        status becomes `queued`. Self-hosted writes it inline, since the
        background pass would have written it anyway.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Requested (or already in flight, or already written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTailoringStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            SaaS mode only: this account's daily letter quota is reached.
            Not enqueued - try again after the daily reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/refresh:
    post:
      operationId: refreshJobs
      tags: [jobs]
      summary: Trigger a background job aggregation + AI tailoring refresh
      responses:
        "202":
          description: Refresh triggered (or already in progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRefreshStatus"
  /explore:
    get:
      operationId: searchExplore
      tags: [explore]
      summary: Search the entire shared pool of postings directly
      description: >
        Free-text search across every posting in the shared pool - saas
        pools every account's signatures/watches together, selfhosted's pool
        is just its own fetches - not only the ones this account's own
        criteria have already scored and queued (that stays GET /jobs).
        Case-insensitive substring match against title, company and
        description; also tried against an accent-folded form of `q`, since
        the stored text itself is not accent-folded (see
        lib/explore-search.ts for the documented limitation this leaves).
        Bounded and paginated - at most 25 results per page, most recently
        posted first - so a search is always an indexed, LIMITed query, never
        a scan of the whole pool. `inMyQueue` is true when this account
        already has a review-queue row for that posting.
      parameters:
        - $ref: "#/components/parameters/ExploreQuery"
        - $ref: "#/components/parameters/ExploreLocation"
        - $ref: "#/components/parameters/ExploreSource"
        - $ref: "#/components/parameters/ExploreLimit"
        - $ref: "#/components/parameters/ExploreOffset"
      responses:
        "200":
          description: Matching postings from the shared pool, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExplorePosting"
        "400":
          description: q is missing or shorter than 2 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /explore/{postingId}/add:
    post:
      operationId: addExplorePosting
      tags: [explore]
      summary: Add a posting found via Explore straight to this account's review queue
      description: >
        Scores the posting against this account's own configuration - the
        same scoring path a normal refresh uses, never a placeholder zero -
        and queues it as `queued`. No timeline event is recorded, since this
        is pre-application (see docs on POST /applications for where the
        real trail starts).
      parameters:
        - $ref: "#/components/parameters/ExplorePostingId"
      responses:
        "201":
          description: Added to the review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreAddResult"
        "404":
          description: Posting not found in the shared pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already in this account's review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List tracked applications
      parameters:
        - $ref: "#/components/parameters/ApplicationStatus"
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Approve a job and log the application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}:
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update an application status or notes
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}/interview.ics:
    get:
      operationId: getInterviewIcs
      tags: [applications]
      summary: Download a calendar (.ics) file for this application's scheduled interview
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Interview calendar event (RFC 5545)
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        "404":
          description: Application not found, or no interview date set for it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}/interview-brief:
    get:
      operationId: getInterviewBrief
      tags: [applications]
      summary: Get the interview preparation brief for an application
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Interview brief state (and content once ready)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewBrief"
        "404":
          description: No brief for this application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}/interview-brief/regenerate:
    post:
      operationId: regenerateInterviewBrief
      tags: [applications]
      summary: Queue a fresh interview brief, discarding the current one
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Brief reset to pending and queued for regeneration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewBrief"
        "404":
          description: No brief for this application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}/interview-brief.pdf:
    get:
      operationId: getInterviewBriefPdf
      tags: [applications]
      summary: Generate a PDF of the interview preparation brief
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Interview brief PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: No brief ready for this application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}/follow-up:
    get:
      operationId: getFollowUpEmail
      tags: [applications]
      summary: Generate a ready-to-copy follow-up e-mail for an application (never sent by JobBlast)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Follow-up e-mail draft (AI-personalized when available, otherwise the deterministic template)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUpEmail"
        "400":
          description: This application is not eligible for a follow-up e-mail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: markFollowedUp
      tags: [applications]
      summary: Record that the user themselves sent a follow-up for this application
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: This application cannot be marked as followed up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}/events:
    get:
      operationId: listApplicationEvents
      tags: [applications]
      summary: Get an application's timeline (applied, status changes, follow-ups, notes, detected e-mails, briefs), newest first
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationEvent"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}/notes:
    post:
      operationId: addApplicationNote
      tags: [applications]
      summary: Append a personal note to an application's timeline (append-only - no edit or delete)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationNoteInput"
      responses:
        "201":
          description: Note recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEvent"
        "400":
          description: Empty note, or over the length cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the job seeker profile
      responses:
        "200":
          description: Job seeker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update job seeker preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /resumes:
    get:
      operationId: listResumes
      tags: [resumes]
      summary: List this account's master resumes (lot I3)
      description: >
        Every master resume this account has, oldest first. An account that
        has never used this feature still gets exactly one entry (its
        existing single master resume, labeled "Main").
      responses:
        "200":
          description: Master resumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resume"
    post:
      operationId: createResume
      tags: [resumes]
      summary: Add a new master resume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeInput"
      responses:
        "201":
          description: Resume created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "400":
          description: This account already has the maximum of 5 resumes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /resumes/{id}:
    patch:
      operationId: updateResume
      tags: [resumes]
      summary: Rename a resume and/or replace its content
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeUpdate"
      responses:
        "200":
          description: Updated resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "404":
          description: No such resume for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteResume
      tags: [resumes]
      summary: Delete a resume
      description: >
        Refused when this would delete the account's last remaining resume -
        every account always has at least one.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "400":
          description: This is the account's last remaining resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such resume for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /resumes/{id}/default:
    post:
      operationId: setDefaultResume
      tags: [resumes]
      summary: Mark a resume as this account's default
      description: >
        The default is the resume used for a posting when no resume scores
        above the others (tie or no shared vocabulary at all), and for
        every account that only has one resume.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated resume, now the default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "404":
          description: No such resume for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List stored documents (CV, cover letter)
      responses:
        "200":
          description: Stored documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentMeta"
  /documents/{type}:
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload (replace) a PDF document
      parameters:
        - $ref: "#/components/parameters/DocumentType"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadPayload"
      responses:
        "200":
          description: Document stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents/{type}/file:
    get:
      operationId: getDocumentFile
      tags: [documents]
      summary: Stream the stored PDF for a document type
      parameters:
        - $ref: "#/components/parameters/DocumentType"
      responses:
        "200":
          description: Document PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/ai/options:
    get:
      operationId: listAiProviderOptions
      tags: [settings]
      summary: List AI providers this machine can detect, with capabilities and availability
      responses:
        "200":
          description: Provider descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProviderOption"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get the current AI provider and automation settings (no secrets)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsState"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update the AI provider and/or automation settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsState"
        "400":
          description: Invalid update (e.g. an unavailable provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/ai/test:
    post:
      operationId: testAiProvider
      tags: [settings]
      summary: Run a tiny real generation through the currently saved AI provider
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
  /settings/ai/credentials:
    get:
      operationId: listAiCredentials
      tags: [settings]
      summary: BYOK credential status for each SaaS-selectable AI provider (never the key itself, SaaS mode only)
      responses:
        "200":
          description: Credential status per BYOK provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiCredentialStatus"
        "404":
          description: BYOK does not exist in selfhosted mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/ai/credentials/{provider}:
    put:
      operationId: saveAiCredential
      tags: [settings]
      summary: Encrypt and store an API key for one BYOK provider (SaaS mode only)
      parameters:
        - $ref: "#/components/parameters/ByokProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAiCredentialRequest"
      responses:
        "200":
          description: Stored - masked status only, never the key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCredentialStatus"
        "400":
          description: Invalid provider or empty key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: BYOK does not exist in selfhosted mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAiCredential
      tags: [settings]
      summary: Remove a stored BYOK credential (SaaS mode only)
      parameters:
        - $ref: "#/components/parameters/ByokProvider"
      responses:
        "204":
          description: Deleted
        "404":
          description: BYOK does not exist in selfhosted mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/companies:
    get:
      operationId: listWatchedCompanies
      tags: [settings]
      summary: List the companies this account watches for new postings (Company Watch)
      responses:
        "200":
          description: Watched companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchedCompany"
    post:
      operationId: addWatchedCompany
      tags: [settings]
      summary: Add a company to watch by its career page URL - detects the ATS and board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchedCompanyRequest"
      responses:
        "201":
          description: Watched, with the detected ATS and a default label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchedCompany"
        "400":
          description: Not a recognized career page URL for any supported ATS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /companies/catalog:
    get:
      operationId: searchCompanyCatalog
      tags: [settings]
      summary: Search the built-in company catalog by name or sector (Company Watch, lot H5)
      description: >
        Case- and accent-insensitive match against the entry's label and
        sector, for the Company Watch "type a name" autocomplete. Returns at
        most 10 results, empty query returns none (the UI only shows this
        dropdown once the visitor has typed something). Picking a result adds
        it the same way pasting its `careerUrl` into
        `POST /settings/companies` would.
      parameters:
        - $ref: "#/components/parameters/CompanyCatalogQuery"
      responses:
        "200":
          description: Matching catalog entries, best match first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyCatalogEntry"
  /settings/companies/{id}:
    delete:
      operationId: removeWatchedCompany
      tags: [settings]
      summary: Stop watching a company
      parameters:
        - $ref: "#/components/parameters/WatchedCompanyId"
      responses:
        "204":
          description: Removed
        "404":
          description: No watched company with this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/ai/credentials/{provider}/test:
    post:
      operationId: testAiCredential
      tags: [settings]
      summary: Make one small real call to a BYOK provider with the given or stored key (SaaS mode only)
      description: >
        Pass `apiKey` to test a candidate value before saving it - never
        persisted by this endpoint, saving is always the separate PUT.
        Omit it to test the already-saved key, which also records
        last_ok_at / last_error on it.
      parameters:
        - $ref: "#/components/parameters/ByokProvider"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAiCredentialRequest"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "400":
          description: Invalid provider, or no key given and none saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: BYOK does not exist in selfhosted mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    ByokProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ByokProviderId"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    JobStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [queued, skipped, applied]
    ApplicationStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [queued, approved, applied, responded, interview, rejected, offer]
    DocumentType:
      name: type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DocumentType"
    WatchedCompanyId:
      name: id
      in: path
      required: true
      schema:
        type: string
    CompanyCatalogQuery:
      name: q
      in: query
      required: false
      description: Free-text match against the catalog entry's name and sector.
      schema:
        type: string
    ExploreQuery:
      name: q
      in: query
      required: true
      description: Free-text match against title, company and description. At least 2 characters.
      schema:
        type: string
        minLength: 2
    ExploreLocation:
      name: location
      in: query
      required: false
      description: Substring match against the posting's location.
      schema:
        type: string
    ExploreSource:
      name: source
      in: query
      required: false
      description: >
        Exact match against a posting's stored source label (e.g.
        "Greenhouse", "France Travail") - the UI populates this from the
        `source` values in the current results rather than a hardcoded list,
        since it does not line up with the internal SourceId config keys.
      schema:
        type: string
    ExploreLimit:
      name: limit
      in: query
      required: false
      description: Max results for this page. Capped at 25.
      schema:
        type: number
    ExploreOffset:
      name: offset
      in: query
      required: false
      schema:
        type: number
    ExplorePostingId:
      name: postingId
      in: path
      required: true
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    JobBlastMode:
      type: string
      enum: [selfhosted, saas]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
      required:
        - id
        - email
        - displayName
    AuthSession:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/JobBlastMode"
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        emailEnabled:
          description: >
            Whether the server can actually send email right now (saas mode,
            transport "smtp", fully configured). Always false in selfhosted.
            The frontend shows the "forgot password" link only when this is
            true - see docs/SAAS-ARCHITECTURE.md section 2 and the G2 lot's
            email transport.
          type: boolean
      required:
        - mode
        - user
        - emailEnabled
    OnboardingStep:
      type: string
      enum: [profile, criteria, byok]
    OnboardingStatus:
      type: object
      properties:
        completed:
          type: boolean
        nextStep:
          description: Null once `completed` is true.
          oneOf:
            - $ref: "#/components/schemas/OnboardingStep"
            - type: "null"
      required:
        - completed
        - nextStep
    OnboardingCompleteResult:
      type: object
      properties:
        completed:
          type: boolean
      required:
        - completed
    RegisterRequest:
      type: object
      properties:
        inviteCode:
          type: string
        email:
          type: string
        password:
          type: string
        displayName:
          type: string
      required:
        - inviteCode
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
      required:
        - token
        - newPassword
    JobStatus:
      type: string
      enum: [queued, skipped, applied]
    ApplicationStatus:
      type: string
      enum: [queued, approved, applied, responded, interview, rejected, offer]
    JobListing:
      type: object
      properties:
        id:
          type: number
        source:
          type: string
        title:
          type: string
        company:
          type: string
        companyInitials:
          type: string
        location:
          type: string
        workMode:
          type: string
          enum: [Remote, Hybrid, On-site]
        url:
          type: string
        description:
          type: string
        postedDate:
          type: string
          format: date
        salaryRange:
          type: string
        fetchedAt:
          type: string
          format: date-time
        relevanceScore:
          type: number
        matchReasons:
          type: array
          items:
            type: string
        highlightedSkills:
          type: array
          items:
            type: string
        tailoredBullets:
          type: array
          items:
            type: string
        coverLetter:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        applicationId:
          type: ["number", "null"]
        aiGenerated:
          type: boolean
        fitAnalysis:
          type: ["object", "null"]
          properties:
            verdict:
              type: string
              enum: [strong, good, stretch, poor]
            greenFlags:
              type: array
              items:
                type: string
            redFlags:
              type: array
              items:
                type: string
            gaps:
              type: array
              items:
                type: string
          required:
            - verdict
            - greenFlags
            - redFlags
            - gaps
      required:
        - id
        - source
        - title
        - company
        - companyInitials
        - location
        - workMode
        - url
        - description
        - postedDate
        - salaryRange
        - fetchedAt
        - relevanceScore
        - matchReasons
        - highlightedSkills
        - tailoredBullets
        - coverLetter
        - status
        - applicationId
        - aiGenerated
        - fitAnalysis
    ExplorePosting:
      type: object
      description: >
        One shared-pool posting as GET /explore returns it - a lighter shape
        than JobListing (no score, no tailored content: those only exist once
        a posting is actually in an account's queue).
      properties:
        id:
          type: number
        source:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        workMode:
          type: string
          enum: [Remote, Hybrid, On-site]
        descriptionExcerpt:
          type: string
          description: HTML-stripped, truncated to ~300 characters on a word boundary.
        postedDate:
          type: string
          format: date
        inMyQueue:
          type: boolean
          description: True when this account already has a review-queue row for this posting.
      required:
        - id
        - source
        - title
        - company
        - location
        - workMode
        - descriptionExcerpt
        - postedDate
        - inMyQueue
    ExploreAddResult:
      type: object
      properties:
        added:
          type: boolean
      required:
        - added
    JobRefreshStatus:
      type: object
      properties:
        started:
          type: boolean
      required:
        - started
    JobTailoringStatus:
      type: object
      properties:
        state:
          description: >
            `ready` - an AI letter exists. `queued` / `running` - a job is
            working on it. `failed` - the last attempt gave up. `template` -
            no AI letter, and none has been asked for. `unavailable` - this
            account has no usable AI provider, so the template letter is
            final.
          type: string
          enum: [ready, queued, running, failed, template, unavailable]
        error:
          type: ["string", "null"]
      required:
        - state
        - error
    Application:
      type: object
      properties:
        id:
          type: number
        jobId:
          type: number
        title:
          type: string
        company:
          type: string
        companyInitials:
          type: string
        location:
          type: string
        appliedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        resumeVersion:
          type: string
        coverLetterVersion:
          type: string
        notes:
          type: string
        followUpDate:
          type: ["string", "null"]
          format: date
        lastFollowedUpAt:
          description: When the user last confirmed sending a follow-up (lot H4). Never set by anything that actually sends mail.
          type: ["string", "null"]
          format: date-time
        followUpCount:
          description: How many follow-ups the user has confirmed sending for this application, capped at 2 suggestions.
          type: number
        followUpEligible:
          description: Whether this application is due for a follow-up suggestion right now (status "applied", no reply, past the account's follow-up delay, under the suggestion cap).
          type: boolean
        interviewAt:
          description: When the user has a scheduled interview for this application, in UTC (lot I2). Null until they set one, cleared back to null if they remove it.
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - jobId
        - title
        - company
        - companyInitials
        - location
        - appliedAt
        - status
        - resumeVersion
        - coverLetterVersion
        - notes
        - followUpDate
        - lastFollowedUpAt
        - followUpCount
        - followUpEligible
        - interviewAt
    ApplicationInput:
      type: object
      properties:
        jobId:
          type: number
        resumeVersion:
          type: string
        coverLetterVersion:
          type: string
        notes:
          type: string
      required:
        - jobId
        - resumeVersion
        - coverLetterVersion
    ApplicationUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        notes:
          type: string
        followUpDate:
          type: ["string", "null"]
          format: date
        interviewAt:
          description: Set, move or clear (null) the scheduled interview date/time. Sent as an ISO datetime, stored in UTC.
          type: ["string", "null"]
          format: date-time
    InterviewBriefStatus:
      type: string
      enum: [pending, generating, ready, failed]
    InterviewBrief:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/InterviewBriefStatus"
        contentMarkdown:
          type: ["string", "null"]
        generatedAt:
          type: ["string", "null"]
          format: date-time
        error:
          type: ["string", "null"]
      required:
        - status
        - contentMarkdown
        - generatedAt
        - error
    FollowUpEmailSource:
      description: >
        Whether the draft is the deterministic template or an AI-personalized
        version. Either way, JobBlast never sends it - the user copies it or
        opens it via a mailto link.
      type: string
      enum: [template, ai]
    FollowUpEmail:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
        source:
          $ref: "#/components/schemas/FollowUpEmailSource"
      required:
        - subject
        - body
        - source
    ApplicationEventKind:
      description: >
        applied - the tracker row was created. status_changed - a status
        move, manual or detected from Gmail (see the payload's origin).
        followed_up - the user confirmed sending a follow-up (lot H4).
        note_added - a personal note (append-only, no edit or delete).
        email_detected - Gmail sync matched (or considered, then declined) an
        e-mail against this application. brief_generated - an interview prep
        brief finished. interview_scheduled - the user set, moved or cleared
        the interview date/time (lot I2).
      type: string
      enum:
        [
          applied,
          status_changed,
          followed_up,
          note_added,
          email_detected,
          brief_generated,
          interview_scheduled,
        ]
    ApplicationEvent:
      type: object
      properties:
        id:
          type: number
        applicationId:
          type: number
        kind:
          $ref: "#/components/schemas/ApplicationEventKind"
        occurredAt:
          type: string
          format: date-time
        payload:
          description: >
            Shape depends on `kind` - see ApplicationEventKind. Never
            contains an e-mail's body: a `subject` field, when present, is a
            short synthetic label built from structured fields, not a quote
            from the message.
          type: object
          additionalProperties: true
      required:
        - id
        - applicationId
        - kind
        - occurredAt
        - payload
    ApplicationNoteInput:
      type: object
