    DashboardSummary:
      type: object
      properties:
        dailyGoal:
          type: number
        appliedToday:
          type: number
        queuedCount:
          type: number
        strongMatchCount:
          type: number
        responseRate:
          type: number
        interviewCount:
          type: number
        offerCount:
          type: number
        needsFollowUp:
          type: number
        streakDays:
          type: number
        recentApplications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        firstBatchPending:
          description: >
            True when this account has never had a single posting yet and is
            still within the "still fetching" window after account creation
            (G1 onboarding lot) - lets the dashboard say so instead of
            showing a silent empty queue. Always false in selfhosted.
          type: boolean
      required:
        - dailyGoal
        - appliedToday
        - queuedCount
        - strongMatchCount
        - responseRate
        - interviewCount
        - offerCount
        - needsFollowUp
        - streakDays
        - recentApplications
        - firstBatchPending
    CampaignFunnel:
      description: >
        Counters for the six stages a tracked application can be described
        by. Not strictly cumulative: `rejected` is its own terminal branch
        (a rejection can land straight from "applied", skipping "responded"
        or "interview"), counted separately rather than nested under an
        earlier stage.
      type: object
      properties:
        toSend:
          description: Status "approved" - prepared but not yet sent to the employer.
          type: number
        sent:
          description: Any status other than "approved".
          type: number
        responded:
          description: Any reply at all, including a rejection - status responded, interview, offer or rejected.
          type: number
        interview:
          description: Reached interview or further - status interview or offer.
          type: number
        offer:
          type: number
        rejected:
          type: number
      required:
        - toSend
        - sent
        - responded
        - interview
        - offer
        - rejected
    CampaignSourceStat:
      type: object
      properties:
        source:
          description: The linked posting's source (e.g. "Adzuna", "France Travail", "ats:workday").
          type: string
        sent:
          type: number
        responded:
          type: number
        responseRate:
          description: Percentage of `sent` that reached `responded`, rounded to the nearest integer.
          type: number
      required:
        - source
        - sent
        - responded
        - responseRate
    CampaignResumeStat:
      type: object
      properties:
        resumeVersion:
          description: The resume label tailored for this application (lot I3).
          type: string
        sent:
          type: number
        responded:
          type: number
        interviews:
          type: number
      required:
        - resumeVersion
        - sent
        - responded
        - interviews
    CampaignWeeklyTrendPoint:
      type: object
      properties:
        weekStart:
          description: Monday of that week, UTC.
          type: string
          format: date
        count:
          type: number
      required:
        - weekStart
        - count
    CampaignStats:
      type: object
      properties:
        funnel:
          $ref: "#/components/schemas/CampaignFunnel"
        bySource:
          description: Only sources with at least one sent application.
          type: array
          items:
            $ref: "#/components/schemas/CampaignSourceStat"
        byResume:
          description: Null unless at least two distinct resume labels have sent applications.
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/CampaignResumeStat"
        weeklyTrend:
          description: Sent applications per week, oldest first, always exactly 8 points (zero-filled).
          type: array
          items:
            $ref: "#/components/schemas/CampaignWeeklyTrendPoint"
        averageResponseDelayDays:
          description: Average days from appliedAt to the first responded/interview/rejected status change. Null with no qualifying data yet.
          type: ["number", "null"]
        responseDelaySampleSize:
          description: How many applications the average above is computed from.
          type: number
      required:
        - funnel
        - bySource
        - byResume
        - weeklyTrend
        - averageResponseDelayDays
        - responseDelaySampleSize
    Profile:
